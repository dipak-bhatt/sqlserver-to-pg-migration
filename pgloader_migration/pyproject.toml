[project]
name = "sqlserver-to-pg-tenant-migration"
version = "1.0.0"
description = "Auditable multi-tenant SQL Server to PostgreSQL migration with pgloader"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.0",
    "psycopg2-binary>=2.9",
    "tabulate>=0.9",
    "pymssql>=2.2",
]

[dependency-groups]
dev = []

[tool.uv]
# This is a scripts-only project, not a Python package
package = false
